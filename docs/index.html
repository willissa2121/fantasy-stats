<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>League History</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("fs-theme");
          document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">
        <div class="brand-mark">F</div>
        <span>League History</span>
      </a>
      <div class="topbar-end">
        <nav>
          <a class="active" href="./">Players</a>
          <a href="./stats.html">Stats</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M21 14.55A8.5 8.5 0 1 1 9.45 3 7 7 0 0 0 21 14.55z"
            />
          </svg>
        </button>
      </div>
    </header>
    <section class="hero">
      <div class="wrap">
        <h1>Every owner. Every season.</h1>
        <p id="hero-copy">Loading league history…</p>
        <div class="search">
          <input id="search" type="search" placeholder="Search players" />
        </div>
      </div>
    </section>
    <main class="wrap" id="rosters">
      <p class="empty">Loading players…</p>
    </main>
    <script src="./js/app.js"></script>
    <script>
      bootIndex();
    </script>
  </body>
</html>
